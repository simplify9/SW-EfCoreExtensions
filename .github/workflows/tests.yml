name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Unit tests
        run: dotnet test SW.EfCoreExtensions.UnitTests
      # Starts PostgreSQL in Docker through Testcontainers.
      - name: PostgreSQL integration tests
        run: dotnet test SW.EfCoreExtensions.PgSql.IntegrationTests
